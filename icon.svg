<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d2440"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#2979ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark rounded-square background -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="14.5" fill="none" stroke="url(#neon)" stroke-width="1" opacity="0.45"/>

  <!-- glowing hexagon + network nodes -->
  <g filter="url(#glow)" stroke="url(#neon)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- hexagon -->
    <path d="M32 10 L51 21 L51 43 L32 54 L13 43 L13 21 Z"/>
    <!-- connecting lines (triangle) -->
    <path d="M32 22 L22 40 M32 22 L42 40 M22 40 L42 40"/>
    <!-- nodes -->
    <circle cx="32" cy="22" r="2.6" fill="url(#neon)" stroke="none"/>
    <circle cx="22" cy="40" r="2.6" fill="url(#neon)" stroke="none"/>
    <circle cx="42" cy="40" r="2.6" fill="url(#neon)" stroke="none"/>
  </g>
</svg>
