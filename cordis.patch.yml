# Bundle patch for @painclown/dsh-proxy-bridge.
# Registers the plugin in the DSH bundle.
# Note: client module removed — DSH web client uses window.__ModuleLoader__.load()
# format, not standard ESM. Config card can be added later with proper format.
- insert:
    - id: dsh-proxy-bridge
      name: '@painclown/dsh-proxy-bridge'
      entry: .
      enabled: true
