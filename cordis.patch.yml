# Bundle patch for @painclown/dsh-proxy-bridge.
# Registers the Host plugin (proxy_bridge tool + BridgeRemoteService) in the
# DSH bundle. The Client configuration card ships as the ./client export and
# is loaded by the web client via window.__ModuleLoader__.load().
- insert:
    - id: dsh-proxy-bridge
      name: '@painclown/dsh-proxy-bridge'
      config: {}
